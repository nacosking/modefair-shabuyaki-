# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── MySQL DataSource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/shabuyaki_db?useSSL=false&serverTimezone=Asia/Kuala_Lumpur&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=shabuyaki_user
spring.datasource.password=shabuyaki_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── Flyway (DB migrations) ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Replace with a secure 256-bit base64 secret in production
app.jwt.secret=c2hhYnV5YWtpLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0LW11c3QtYmUtbG9uZy1lbm91Z2g=
app.jwt.access-token-expiry-ms=900000
# 15 minutes

app.jwt.refresh-token-expiry-days=7

# ─── Cookie ───────────────────────────────────────────────────────────────────
app.cookie.secure=false
# Set true in production (HTTPS only)
app.cookie.same-site=Strict
app.cookie.domain=localhost

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ─── Restaurant ───────────────────────────────────────────────────────────────
app.restaurant.receipt-prefix=SBY
app.restaurant.name=Shabuyaki
app.restaurant.address=Level 23, Menara KL Tower, Bukit Nanas, 50250 Kuala Lumpur
app.restaurant.phone=+60 3-2181 0000

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.shabuyaki=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
